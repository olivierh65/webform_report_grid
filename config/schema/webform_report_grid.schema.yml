webform_report_grid.settings:
  type: config_object
  label: 'Webform report grid display settings'
  mapping:
    font_size:
      type: float
      label: 'Base font size (rem)'
    card_gap:
      type: integer
      label: 'Gap between cards (px)'
    column_width:
      type: integer
      label: 'Grid column width (px)'
    columns:
      type: integer
      label: 'Number of grid columns'
    auto_size_cards:
      type: boolean
      label: 'Auto-size cards to fit content (deprecated, unused by the viewer)'
    front_compact:
      type: boolean
      label: 'Pack cards upward in the front view'

# Data card (also used for folder children).
webform_report_grid.card_leaf:
  type: mapping
  label: 'Grid data card'
  mapping:
    type:
      type: string
      label: 'Card type (card|folder)'
      nullable: true
    field:
      type: string
    source_fields:
      type: sequence
      sequence:
        type: string
    mode:
      type: string
    display_mode:
      type: string
    agg:
      type: string
    value_filter:
      type: sequence
      nullable: true
      sequence:
        type: string
    value_filters:
      type: sequence
      label: 'Per source field value filters'
      nullable: true
      sequence:
        type: sequence
        sequence:
          type: string
    x:
      type: integer
      nullable: true
    y:
      type: integer
      nullable: true
    w:
      type: integer
    h:
      type: integer
    px_w:
      type: integer
      label: 'Saved pixel width'
      nullable: true
    min_h:
      type: integer
      nullable: true
    max_h:
      type: integer
      nullable: true
    auto_h:
      type: boolean
      label: 'Height fitted to content'
      nullable: true
    label:
      type: string
    group_label:
      type: string
      nullable: true
    summary_label:
      type: string
      nullable: true
    source_labels:
      type: sequence
      nullable: true
      sequence:
        type: string
    section_labels:
      type: sequence
      nullable: true
      sequence:
        type: string

# Top-level card: a data card or a folder (one nesting level only).
webform_report_grid.card:
  type: webform_report_grid.card_leaf
  label: 'Grid card or folder'
  mapping:
    collapsed:
      type: boolean
      label: 'Folder collapsed by default'
      nullable: true
    h_open:
      type: integer
      label: 'Folder height when expanded'
      nullable: true
    children:
      type: sequence
      label: 'Folder children cards'
      nullable: true
      sequence:
        type: webform_report_grid.card_leaf

webform_report.webform_report.*:
  type: config_entity
  label: 'Webform grid report'
  mapping:
    id:
      type: string
      label: 'ID'
    label:
      type: label
      label: 'Label'
    uuid:
      type: string
    webform_id:
      type: string
      label: 'Target webform ID'
    filter_field:
      type: string
      label: 'Global filter field'
    cards:
      type: sequence
      label: 'Grid cards'
      sequence:
        type: webform_report_grid.card
