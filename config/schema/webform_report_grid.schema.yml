webform_report_grid.settings:
  type: config_object
  label: 'Webform report grid display settings'
  mapping:
    font_size:
      type: float
      label: 'Base font size (rem)'
    card_gap:
      type: integer
      label: 'Gap between cards (px)'
    column_width:
      type: integer
      label: 'Grid column width (px)'
    columns:
      type: integer
      label: 'Number of grid columns'
    auto_size_cards:
      type: boolean
      label: 'Auto-size cards to fit content (deprecated, unused by the viewer)'
    front_compact:
      type: boolean
      label: 'Pack cards upward in the front view'
